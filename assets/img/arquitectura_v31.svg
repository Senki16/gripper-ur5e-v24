<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" font-family="Inter, system-ui, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#141414"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#ef6a1a"/></marker>
    <marker id="o2" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 0 5 10 10z" fill="#141414"/></marker>
    <style>
      .bx{fill:#fbfaf8;stroke:#141414;stroke-width:1.5}
      .hb{fill:#141414}
      .t{font-size:16px;font-weight:600;fill:#141414}
      .s{font-size:12.5px;fill:#57544e}
      .m{font-family:"JetBrains Mono",monospace;font-size:11.5px;fill:#8a867e;letter-spacing:.06em}
      .pw{stroke:#ef6a1a;stroke-width:4;fill:none}
      .sg{stroke:#141414;stroke-width:1.4;fill:none}
      .lb{font-family:"JetBrains Mono",monospace;font-size:11.5px;fill:#b9480a;font-weight:600}
      .ls{font-family:"JetBrains Mono",monospace;font-size:11px;fill:#57544e}
    </style>
  </defs>
  <!-- UR5e -->
  <rect class="hb" x="20" y="150" width="170" height="130" rx="12"/>
  <text x="40" y="186" font-size="12" font-family="JetBrains Mono" fill="#a9a59c" letter-spacing=".08em">ROBOT</text>
  <text x="40" y="214" font-size="22" font-weight="600" fill="#f1efea">UR5e</text>
  <text x="40" y="240" font-size="12.5" fill="#a9a59c">Conector de herramienta</text>
  <text x="40" y="258" font-size="12.5" fill="#a9a59c">M8 · 8 pines</text>
  <!-- PCB1 -->
  <rect class="bx" x="290" y="40" width="250" height="130" rx="12"/>
  <text class="m" x="310" y="66">PCB1 · POTENCIA</text>
  <text class="t" x="310" y="92">Fusibles + 3 ramas</text>
  <text class="s" x="310" y="116">Fusible principal, 3 A / 2 A</text>
  <text class="s" x="310" y="136">Reserva 2200 µF y 1000 µF</text>
  <text class="s" x="310" y="156">12 V · 6 V · 5 V</text>
  <!-- PCB2 -->
  <rect class="bx" x="290" y="260" width="250" height="140" rx="12"/>
  <text class="m" x="310" y="286">PCB2 · CONTROL</text>
  <text class="t" x="310" y="312">ESP32-S3 en zócalos</text>
  <text class="s" x="310" y="336">Filtros RC 10 kΩ / 100 nF</text>
  <text class="s" x="310" y="356">Pull-down 10 kΩ en los drivers</text>
  <text class="s" x="310" y="376">Buffer 74HCT125 + divisor</text>
  <!-- actuadores y sensores -->
  <rect class="bx" x="700" y="20" width="220" height="80" rx="12"/>
  <text class="m" x="720" y="46">ACTUADOR MCP</text><text class="t" x="720" y="72">Servo AX-18A</text><text class="s" x="720" y="90">12 V · posición y carga</text>
  <rect class="bx" x="700" y="130" width="220" height="80" rx="12"/>
  <text class="m" x="720" y="156">DRIVERS</text><text class="t" x="720" y="182">3 × TC1508A</text><text class="s" x="720" y="200">puente H por dedo</text>
  <rect class="bx" x="960" y="130" width="220" height="80" rx="12"/>
  <text class="m" x="980" y="156">ACTUADORES PIP</text><text class="t" x="980" y="182">3 motores DC</text><text class="s" x="980" y="200">6 V · sinfín autobloqueante</text>
  <rect class="bx" x="700" y="300" width="220" height="90" rx="12"/>
  <text class="m" x="720" y="326">SENSORES</text><text class="t" x="720" y="352">3 FSR + finales</text><text class="s" x="720" y="372">uno por yema · apertura/cierre</text>
  <!-- energía -->
  <path class="pw" d="M190 190 H240 V105 H286" marker-end="url(#o)"/>
  <text class="lb" x="200" y="140">24 V</text>
  <path class="pw" d="M540 70 H696" marker-end="url(#o)"/><text class="lb" x="600" y="62">12 V</text>
  <path class="pw" d="M540 140 H620 V170 H696" marker-end="url(#o)"/><text class="lb" x="560" y="132">6 V</text>
  <path class="pw" d="M415 170 V256" marker-end="url(#o)"/><text class="lb" x="424" y="222">5 V</text>
  <!-- señales -->
  <path class="sg" d="M190 250 H240 V330 H286" marker-end="url(#a)" marker-start="url(#o2)"/>
  <text class="ls" x="198" y="300">RS-485</text>
  <path class="sg" d="M540 290 H640 V90 H696" marker-end="url(#a)" marker-start="url(#o2)"/>
  <text class="ls" x="560" y="282">bus servo · 1 Mbps</text>
  <path class="sg" d="M540 320 H660 V190 H696" marker-end="url(#a)"/>
  <text class="ls" x="560" y="314">PWM · 6 señales</text>
  <path class="sg" d="M920 170 H956" marker-end="url(#a)"/>
  <path class="sg" d="M696 345 H540" marker-end="url(#a)"/>
  <text class="ls" x="580" y="362">ADC · filtro RC</text>
  <!-- leyenda -->
  <path class="pw" d="M960 300 H1000"/><text class="s" x="1010" y="304">Energía</text>
  <path class="sg" d="M960 330 H1000"/><text class="s" x="1010" y="334">Señales y datos</text>
</svg>
