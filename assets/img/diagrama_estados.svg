<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="Inter, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#141414"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#ef6a1a"/></marker>
    <style>
      .b{fill:#fff;stroke:#141414;stroke-width:1.6}
      .k{fill:#141414}
      .x{fill:#fff;stroke:#ef6a1a;stroke-width:2}
      .t{font-size:20px;font-weight:600;fill:#141414}
      .s{font-size:14px;fill:#55534e}
      .m{font-family:"JetBrains Mono",Consolas,monospace;font-size:13px;fill:#141414}
      .mr{font-family:"JetBrains Mono",Consolas,monospace;font-size:13px;fill:#b9480a}
      .l{stroke:#141414;stroke-width:1.6;fill:none}
      .lr{stroke:#ef6a1a;stroke-width:1.8;fill:none}
    </style>
  </defs>
  <!-- inicio -->
  <rect class="k" x="40" y="60" width="210" height="110" rx="55"/>
  <text x="80" y="108" font-size="20" font-weight="600" fill="#fff">Arranque</text>
  <text x="80" y="134" font-size="13.5" fill="#a9a59c">motores y servo en 0</text>
  <text x="80" y="152" font-size="13.5" fill="#a9a59c">UART 115200 · Wi-Fi</text>
  <!-- espera -->
  <rect class="b" x="360" y="60" width="230" height="110" rx="14"/>
  <text class="t" x="384" y="104">Espera</text><text class="s" x="384" y="130">lee una línea por UART</text><text class="s" x="384" y="150">responde OK IDLE a PING</text>
  <!-- ejecuta -->
  <rect class="b" x="700" y="60" width="240" height="110" rx="14"/>
  <text class="t" x="724" y="104">Ejecuta la orden</text><text class="s" x="724" y="130">OPEN · CLOSE · M · ALL</text><text class="s" x="724" y="150">SERVO · STATUS · GET</text>
  <!-- activo -->
  <rect class="b" x="700" y="300" width="240" height="110" rx="14"/>
  <text class="t" x="724" y="344">Activo</text><text class="s" x="724" y="370">motores o servo en marcha</text><text class="s" x="724" y="390">PING renueva la orden</text>
  <!-- parada -->
  <rect class="x" x="360" y="300" width="230" height="110" rx="14"/>
  <text class="t" x="384" y="344" fill="#b9480a">Parada segura</text><text class="s" x="384" y="370">PWM = 0, servo sin señal</text><text class="s" x="384" y="390">registra el evento</text>
  <!-- telemetría -->
  <rect class="b" x="40" y="440" width="1120" height="80" rx="14" stroke-dasharray="6 5"/>
  <text class="t" x="64" y="476">Tarea de red en paralelo</text>
  <text class="s" x="64" y="500">Cada evento y una muestra cada 500 ms van a una cola de 64 y se envían por Wi-Fi (HTTPS, JSON) al servidor de telemetría.</text>
  <!-- transiciones -->
  <path class="l" d="M250 115 H356" marker-end="url(#a)"/>
  <path class="l" d="M590 105 H696" marker-end="url(#a)"/><text class="m" x="602" y="96">orden válida</text>
  <path class="l" d="M820 170 V296" marker-end="url(#a)"/><text class="m" x="830" y="240">mueve un actuador</text>
  <path class="l" d="M760 170 C 700 230, 640 200, 590 140" marker-end="url(#a)"/><text class="m" x="668" y="240">consulta</text>
  <path class="lr" d="M700 370 H594" marker-end="url(#r)"/><text class="mr" x="614" y="356">500 ms</text><text class="mr" x="610" y="392">sin orden</text>
  <path class="l" d="M940 330 C 1040 330, 1040 120, 944 120" marker-end="url(#a)"/>
  <path class="lr" d="M700 140 C 650 250, 560 260, 520 296" marker-end="url(#r)"/><text class="mr" x="586" y="282">STOP · orden inválida</text>
  <path class="l" d="M440 300 V174" marker-end="url(#a)"/><text class="m" x="300" y="240">vuelve a esperar</text>
  <text class="m" x="1046" y="230">nueva orden</text>
</svg>
